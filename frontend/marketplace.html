<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaarigar - Marketplace</title>
  <link rel="stylesheet" href="seller.css">
  <link rel="stylesheet" href="marketplace.css">
</head>
<body>
  <!-- Header -->
  <header class="main-header">
    <div class="header-content marketplace-header">
      <div class="brand-group">
        <h1 class="brand-hindi">कारीगर</h1>
        <div class="brand-subtitle">KAARIGAR</div>
      </div>
      <nav class="marketplace-nav">
        <a href="#">Home</a>
        <a href="#" class="active">Shop</a>
        <a href="#">Categories</a>
        <a href="#">About</a>
      </nav>
    </div>
    <div class="orange-border"></div>
  </header>

  <main class="container">
    <div class="marketplace-hero">
      <h2>Handcrafted. Authentic. Yours.</h2>
      <p>Discover beautiful creations made by skilled artisans.</p>
    </div>

    <div class="products-grid" id="productsGrid">
      <div class="loading-state">
        <div class="spinner"></div>
        <span>Loading artisan products...</span>
      </div>
    </div>
  </main>

  <script src="marketplace.js"></script>
</body>
</html>
