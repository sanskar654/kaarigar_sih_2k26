<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaarigar Marketplace - View Product</title>
  <link rel="stylesheet" href="seller.css">
</head>
<body>

  <!-- Main Kaarigar Top Header -->
  <header class="main-header">
    <div class="header-content">
      <h1 class="brand-hindi">कारीगर</h1>
      <div class="brand-subtitle">KAARIGAR</div>
      <div class="brand-title">Product Details</div>
    </div>
    <div class="orange-border"></div>
  </header>

  <main class="container">
    
    <section class="card-section" id="listingDetailSection">
      <h2 class="preview-main-title" id="productTitle">Product Name</h2>
      <p class="preview-subtitle">Published on Kaarigar Marketplace</p>

      <div class="section-header">Product Information</div>
      <div class="section-body">

        <div class="display-field">
          <div class="field-label">Product Photo</div>
          <div class="photo-display-container">
            <img id="productImage" src="" alt="Product Photo" class="preview-enhanced-photo">
          </div>
        </div>

        <div class="display-field">
          <div class="field-label">Category</div>
          <div class="field-value" id="productCategory">-</div>
        </div>

        <div class="display-field">
          <div class="field-label">Subcategory</div>
          <div class="field-value" id="productSubcategory">-</div>
        </div>

        <div class="display-field">
          <div class="field-label">Quantity Available</div>
          <div class="field-value" id="productQuantity">-</div>
        </div>

        <div class="display-field">
          <div class="field-label">Description</div>
          <div class="field-value" id="productDescription">-</div>
        </div>

        <div class="display-field">
          <div class="field-label">Price</div>
          <div class="field-value price-value" id="productPrice">-</div>
        </div>
      </div>

      <div class="section-header">Artisan Information</div>
      <div class="section-body">
        <div class="artisan-row">
          <div><strong>Artisan:</strong> <span id="artisanName">-</span></div>
          <div><strong>Craft:</strong> <span id="artisanCraft">-</span></div>
          <div><strong>Location:</strong> <span id="artisanLocation">-</span></div>
          <div class="verified-badge-container">
            <span class="verified-badge" id="verifiedBadge" style="display:none;">✓ Verified Artisan</span>
          </div>
        </div>
      </div>

      <div class="preview-actions">
        <a href="/seller.html" class="btn-secondary" style="text-decoration:none;">Sell Another Product</a>
      </div>
    </section>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');

      if (!id) {
        alert('No listing ID provided.');
        return;
      }

      try {
        const res = await fetch(`/api/listing/${id}`);
        if (!res.ok) throw new Error('Listing not found');
        const listing = await res.json();

        document.getElementById('productTitle').innerText = listing.product.name;
        document.getElementById('productImage').src = listing.photo.enhanced || listing.photo.original;
        document.getElementById('productCategory').innerText = listing.product.category;
        document.getElementById('productSubcategory').innerText = listing.product.subcategory;
        document.getElementById('productQuantity').innerText = listing.product.quantity;
        document.getElementById('productDescription').innerText = listing.description.generatedLocal || listing.description.generatedEnglish || listing.description.original;
        document.getElementById('productPrice').innerText = `₹${listing.pricing.finalPrice}`;

        document.getElementById('artisanName').innerText = listing.artisan.name;
        document.getElementById('artisanCraft').innerText = listing.artisan.craft;
        document.getElementById('artisanLocation').innerText = listing.artisan.location;

        if (listing.artisan.verified) {
          document.getElementById('verifiedBadge').style.display = 'inline-block';
        }
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
