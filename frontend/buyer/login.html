<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaarigar - Buyer Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <b>Kaarigar</b><span>कारीगर</span>
    </a>
    <nav class="nav">
      <a href="index.html" data-i18n="nav_browse">Browse</a>
      <a class="cart-pill" href="cart.html">
        <span data-i18n="nav_cart">Cart</span>
        <span data-cart-count>0</span>
      </a>
    </nav>
  </div>
</header>

<main class="wrap" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="panel" style="width: 100%; max-width: 400px; padding: 2rem;">
        <h2 id="formTitle" style="text-align: center; margin-bottom: 1.5rem;">Buyer Login</h2>
        
        <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
            <button id="tabLogin" class="btn block" style="flex: 1;">Login</button>
            <button id="tabRegister" class="btn ghost block" style="flex: 1;">Register</button>
        </div>

        <div id="errorMessage" class="note err hide" style="margin-bottom: 1rem;"></div>

        <form id="authForm" style="display: flex; flex-direction: column; gap: 1rem;">
            <div id="registerFields" style="display: none; flex-direction: column; gap: 1rem;">
                <div class="field">
                    <label for="name">Full Name</label>
                    <input type="text" id="name">
                </div>
                <div class="field">
                    <label for="city">City</label>
                    <input type="text" id="city">
                </div>
            </div>

            <div class="field">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="+91...">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>

            <button type="submit" id="submitBtn" class="btn block" style="margin-top: 1rem;">Login</button>
        </form>
    </div>
</main>
<footer class="site-footer">
  <div class="wrap">
    <span>Kaarigar · SIH26090 · Team Blackbox</span>
    <span class="muted" data-i18n="footer_test_mode">Prototype — payments run in Razorpay Test Mode.</span>
  </div>
</footer>
<script src="assets/locales.js"></script>
<script src="assets/lang-switcher.js"></script>
<script src="js/login.js"></script>
</body>
</html>
