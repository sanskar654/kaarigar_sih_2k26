<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaarigar - Buyer Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="auth-container" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-color); padding: 2rem;">
        <div class="auth-card" style="background: var(--card-bg); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; border: 1px solid var(--border-color);">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="color: var(--primary-color); font-family: 'Outfit', sans-serif; font-size: 2rem;">Kaarigar</h1>
                <h2 id="formTitle" style="color: var(--text-color); margin-top: 0.5rem; font-weight: 500;">Buyer Login</h2>
            </div>
            
            <div class="tabs" style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                <button id="tabLogin" class="btn btn-primary" style="flex: 1; border-radius: 8px;">Login</button>
                <button id="tabRegister" class="btn btn-outline" style="flex: 1; border-radius: 8px; background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color);">Register</button>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" style="display: none; background: #fee2e2; color: #b91c1c; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem;"></div>

            <form id="authForm" style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- Register Only Fields -->
                <div id="registerFields" style="display: none; flex-direction: column; gap: 1rem;">
                    <div class="form-group">
                        <label for="name" style="display: block; margin-bottom: 0.5rem; color: var(--text-color);">Full Name</label>
                        <input type="text" id="name" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit;">
                    </div>
                    <div class="form-group">
                        <label for="city" style="display: block; margin-bottom: 0.5rem; color: var(--text-color);">City</label>
                        <input type="text" id="city" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit;">
                    </div>
                </div>

                <!-- Common Fields -->
                <div class="form-group">
                    <label for="phone" style="display: block; margin-bottom: 0.5rem; color: var(--text-color);">Phone Number</label>
                    <input type="tel" id="phone" required placeholder="+91..." style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit;">
                </div>
                <div class="form-group">
                    <label for="password" style="display: block; margin-bottom: 0.5rem; color: var(--text-color);">Password</label>
                    <input type="password" id="password" required placeholder="Enter password" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit;">
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 1rem; border-radius: 8px; font-weight: 600; margin-top: 1rem;">Login</button>
                <a href="index.html" style="text-align: center; color: var(--text-light); text-decoration: none; font-size: 0.9rem; margin-top: 0.5rem;">&larr; Back to Home</a>
            </form>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
